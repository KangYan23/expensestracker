services:
  mongo:
    image: mongo:7
    container_name: expense_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network

  backend:
    build:
      context: ./backend
    image: expense-backend:latest # must match k8s/backend-deployment.yaml
    container_name: expense_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.local
    depends_on:
      - mongo
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
    image: expense-frontend:latest # must match k8s/frontend-deployment.yaml
    container_name: expense_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - app_network

  jenkins:
    build:
      context: ./jenkins
    image: expense-jenkins:latest
    container_name: expense_jenkins
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
      - JENKINS_ADMIN_USER=${JENKINS_ADMIN_USER:-admin}
      - JENKINS_ADMIN_PASS=${JENKINS_ADMIN_PASS:-admin}
      - JENKINS_URL=${JENKINS_URL:-http://localhost:8080/}
      - GIT_REPO_URL=${GIT_REPO_URL:-https://github.com/KangYan23/expensestracker.git}
      - GIT_BRANCH=${GIT_BRANCH:-main}
      - GIT_CREDENTIALS_ID=${GIT_CREDENTIALS_ID:-}
      - EMAIL_RECIPIENT=${EMAIL_RECIPIENT:-}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_TLS=${SMTP_TLS:-true}
      - SMTP_SSL=${SMTP_SSL:-false}
    volumes:
      - jenkins_home:/var/jenkins_home
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongo_data:
  jenkins_home:
