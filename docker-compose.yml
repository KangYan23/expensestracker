services:
  mongo:
    image: mongo:7  
    container_name: expense_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network

  backend:
    build:
      context: ./backend
    image: expense-backend:latest   # must match k8s/backend-deployment.yaml
    container_name: expense_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.local
    depends_on:
      - mongo
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
    image: expense-frontend:latest   # must match k8s/frontend-deployment.yaml
    container_name: expense_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production 
      - NEXT_PUBLIC_API_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mongo_data:
