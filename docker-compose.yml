services:
  mongo:
    image: mongo:7
    container_name: expense_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network

  backend:
    build:
      context: ./backend
    image: expense-backend:latest # must match k8s/backend-deployment.yaml
    container_name: expense_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.local
    depends_on:
      - mongo
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
    image: expense-frontend:latest # must match k8s/frontend-deployment.yaml
    container_name: expense_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://backend:5000
    depends_on:
      - backend
    networks:
      - app_network

  # ─── Monitoring Stack ────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: expense_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - app_network
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: expense_grafana
    ports:
      - "3001:3000" # Access Grafana at http://localhost:3001
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin # Change this!
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - app_network
    depends_on:
      - prometheus

  mongo-exporter:
    image: percona/mongodb_exporter:0.40
    container_name: expense_mongo_exporter
    command:
      - '--collect-all'
      - '--mongodb.uri=mongodb://mongo:27017'
    ports:
      - "9216:9216"
    networks:
      - app_network
    depends_on:
      - mongo

networks:
  app_network:
    driver: bridge

volumes:
  mongo_data:
  grafana_data:
