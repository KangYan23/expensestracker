global:
  scrape_interval: 15s

scrape_configs:
  # Prometheus scrapes itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Your Express backend (after you add prom-client)
  - job_name: 'expense-backend'
    static_configs:
      - targets: ['backend:5000']
    metrics_path: '/metrics'

  # MongoDB exporter
  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongo-exporter:9216']
